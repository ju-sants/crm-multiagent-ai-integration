function renderRunDetails(runs) {
    if (!runs || !runs.length) return '';
    let html = `<div class="run-details-list">`;
    runs.forEach((r,i) => {
        const rScore = r.evaluation && typeof r.evaluation.overall_score==='number' ? r.evaluation.overall_score : null;
        const rCls = rScore!==null ? (rScore>=7?'text-green':rScore>=5?'text-yellow':'text-red') : 'text-dim';
        const statusCls = r.status==='success' ? 'success' : 'error';
        html += `<div class="run-detail ${statusCls}">`;
        html += `<div class="run-detail-row">`;
        if (r.agent) html += `<span class="fw-600">${r.agent}</span>`;
        if (r.scenario) html += `<span class="text-yellow">${r.scenario}</span>`;
        html += `<span>${r.model||''}</span>`;
        html += `<span>#${r.iteration||i+1}</span>`;
        html += `<span>${r.duration_s}s</span>`;
        html += `<span>${r.status}</span>`;
        if (rScore!==null) html += `<span class="${rCls} fw-700">${rScore}/10</span>`;
        if (r.tokens) html += `<span>${r.tokens.total||'?'} tok</span>`;
        html += `</div>`;
        if (r.evaluation && r.evaluation.scores) {
            html += `<div class="run-detail-scores">`;
            for (const [k,v] of Object.entries(r.evaluation.scores)) {
                html += `<span>${k}: <strong>${v}</strong></span>`;
            }
            html += `</div>`;
        }
        if (r.evaluation && r.evaluation.issues && r.evaluation.issues.length) {
            html += `<div class="run-detail-issues">Issues: ${r.evaluation.issues.join('; ')}</div>`;
        }
        if (r.evaluation_error) html += `<div class="text-red fs-10">Eval error: ${r.evaluation_error}</div>`;
        if (r.error) html += `<div class="text-red fs-10">Error: ${r.error.substring(0,200)}</div>`;
        if (r.output_preview) html += `<details class="run-detail-expand"><summary>Output</summary><pre class="run-detail-pre">${escHtml(r.output_preview.substring(0,800))}</pre></details>`;
        if (r.interpolated_prompt) html += `<details class="run-detail-expand"><summary class="text-blue">Prompt Interpolado</summary><pre class="run-detail-pre">${escHtml(JSON.stringify(r.interpolated_prompt,null,2))}</pre></details>`;
        html += `</div>`;
    });
    html += `</div>`;
    return html;
}

// --- Models Dashboard ---
function renderModels(c) {
    Promise.all([
        fetch(`${BASE}/models/mapping`).then(r=>r.json()),
        fetch(`${BASE}/benchmarks/models`).then(r=>r.json()),
    ]).then(([mappingData, modelsData]) => {
        let html = `<div class="section-title">Mapeamento Agente → Modelo</div>`;
        html += `<p style="font-size:12px;color:var(--text-dim);margin-bottom:12px;">Configure qual modelo cada agente usa. Overrides globais afetam todas as sessoes. Overrides por sessao tem prioridade.</p>`;

        html += '<table class="data-table"><tr><th>Agent</th><th>Default</th><th>Override</th><th>Acao</th></tr>';
        const allModels = Object.keys(modelsData.models);
        for (const [agent, defaultModel] of Object.entries(mappingData.defaults)) {
            const override = mappingData.overrides[agent] || '';
            const activeModel = override || defaultModel;
            html += `<tr>`;
            html += `<td style="font-weight:600">${agent}</td>`;
            html += `<td style="color:var(--text-dim)">${defaultModel}</td>`;
            html += `<td><select class="form-select" style="width:auto;display:inline" id="ov_${agent}">`;
            html += `<option value="">— default —</option>`;
            allModels.forEach(m=>{ html += `<option value="${m}" ${m===override?'selected':''}>${m}</option>`; });
            html += `</select></td>`;
            html += `<td><button class="btn btn-primary btn-sm" onclick="setOverride('${agent}')">Set</button> `;
            if (override) html += `<button class="btn btn-danger btn-sm" onclick="removeOverride('${agent}')">Remove</button>`;
            html += `</td></tr>`;
        }
        html += '</table>';
        c.innerHTML = html;
    });
}
function setOverride(agent) {
    const model = document.getElementById('ov_'+agent).value;
    if (!model) return removeOverride(agent);
    fetch(`${BASE}/models/override`, { method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ agent, model })
    }).then(()=>refreshDashboard());
}
function removeOverride(agent) {
    fetch(`${BASE}/models/override`, { method:'DELETE', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ agent })
    }).then(()=>refreshDashboard());
}

// --- Scenarios Dashboard ---
function renderScenarios(c) {
    Promise.all([
        fetch(`${BASE}/scenarios`).then(r=>r.json()),
        fetch(`${BASE}/synthetic/scenarios`).then(r=>r.json()),
    ]).then(([fileScenarios, syntheticData]) => {
        let html = `<div class="section-title">Cenarios Sinteticos (para Benchmark)</div>`;
        html += `<p style="font-size:12px;color:var(--text-dim);margin-bottom:12px;">Estados pre-construidos com dados realistas. Use na aba Benchmarks ou injete manualmente.</p>`;
        const synth = syntheticData.scenarios || {};
        if (Object.keys(synth).length) {
            html += '<table class="data-table"><tr><th>Nome</th><th>Turn</th><th>Contexto</th><th>Agentes Foco</th><th>Descricao</th><th>Acao</th></tr>';
            for (const [name,info] of Object.entries(synth)) {
                html += `<tr><td style="font-weight:600">${name}</td><td>${info.turn}</td><td>${info.topic}</td><td style="font-size:11px">${info.agent_focus.join(', ')}</td><td style="font-size:11px">${info.description}</td>`;
                html += `<td><button class="btn btn-secondary btn-sm" onclick="injectSynthetic('${name}')">Injetar</button></td></tr>`;
            }
            html += '</table>';
        }

        html += `<div class="section-title" style="margin-top:24px;">Cenarios de Chat (JSON)</div>`;
        html += `<p style="font-size:12px;color:var(--text-dim);margin-bottom:12px;">Cenarios de mensagens em dev_chat/scenarios/. Para executar, use o CLI runner.</p>`;
        const d = fileScenarios;
        if (d.scenarios && d.scenarios.length) {
            html += '<table class="data-table"><tr><th>Nome</th><th>Arquivo</th><th>Msgs</th><th>Descricao</th></tr>';
            d.scenarios.forEach(s=>{
                html += `<tr><td style="font-weight:600">${s.name}</td><td style="color:var(--text-dim)">${s.file}</td><td>${s.messages_count}</td><td style="font-size:11px">${s.description.substring(0,100)}</td></tr>`;
            });
            html += '</table>';
        } else { html += '<p>Nenhum cenario de chat encontrado.</p>'; }

        html += `<div class="section-title" style="margin-top:20px;">CLI Runner</div>`;
        html += `<pre style="font-size:11px;background:var(--surface);padding:12px;border-radius:6px;">
# Executar cenario com discriminador
python -m dev_chat.runner --scenario dev_chat/scenarios/sales_carro_completo.json --discriminator

# Modo interativo
python -m dev_chat.runner --interactive --discriminator

# Mensagem avulsa
python -m dev_chat.runner --message "oi quero rastreador" --session test1 --discriminator

# Com reset
python -m dev_chat.runner --scenario dev_chat/scenarios/sales_objecao_preco.json --reset --discriminator --output results.json</pre>`;
        c.innerHTML = html;
    });
}
function injectSynthetic(name) {
    if (!confirm(`Injetar cenario "${name}" no Redis?`)) return;
    fetch(`${BASE}/synthetic/inject`, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ scenario: name })
    }).then(r=>r.json()).then(d=>{
        if (d.error) alert('Erro: '+d.error);
        else alert(`Injetado! contact_id: ${d.contact_id}`);
    });
}
